name: Build

# The port was written in a Linux container with no Swift toolchain, so this
# workflow is where it actually gets compiled and run. Four jobs:
#   kit       - AnixartKit unit tests, no simulator needed
#   app       - type-check the app for the simulator (fastest signal)
#   smoke     - boot a simulator, install, launch, and fail on a launch crash
#   ipa       - unsigned .ipa for sideloading, uploaded as an artifact
#   release   - publishes that .ipa as an alpha pre-release, gated on smoke
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      full_release:
        description: >-
          Publish as a full release instead of an alpha pre-release.
          Leave off until the port is considered finished.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: AnixartKit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The runner ships several Xcodes and defaults to a 16.x one, whose SDK has no
      # Liquid Glass. Pick the newest 26.x so the iOS 26 SDK is what we build against;
      # the deployment target stays 17.0, so older systems get the compatibility look.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE" || { echo "::error::no Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build and test AnixartKit
        working-directory: Packages/AnixartKit
        run: swift test --enable-code-coverage

  # The APK's annotations give the key names but not every shape the server
  # actually sends: a relation can arrive as an object or as a bare id, and a
  # field the decompiled model calls non-null can be absent. That only shows up
  # against the live API, so this job fetches real responses and runs them
  # through the real decoders -- a mismatch fails here with its coding path
  # instead of as an error banner on a screen.
  probe:
    name: Live response shapes
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE" || { echo "::error::no Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "$XCODE"

      # Nothing here is account-specific: the release and the profile are
      # whatever the server offers, so no id of anyone's is committed.
      - name: Fetch live responses
        id: fetch
        run: |
          set -u
          API=https://api-s.anixsekai.com
          DIR="$RUNNER_TEMP/live"
          mkdir -p "$DIR"

          get() { curl -sS --max-time 30 "$2" -o "$DIR/$1.json" || echo "::warning::$1 failed"; }

          get release-random "$API/release/random?extended_mode=true"
          RID=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["release"]["id"])' "$DIR/release-random.json")
          echo "release id: $RID"

          get release-one       "$API/release/$RID?extended_mode=true"
          get types-release     "$API/episode/$RID"
          get comments-release  "$API/release/comment/all/$RID/0?sort=1"
          get collections-of    "$API/collection/all/release/$RID/0?sort=0"

          # Drill into the first voice-over and its first hosting, which is the
          # path the player takes.
          TID=$(python3 -c 'import json,sys;t=json.load(open(sys.argv[1])).get("types") or [];print(t[0]["id"] if t else "")' "$DIR/types-release.json")
          if [ -n "$TID" ]; then
            get sources-type "$API/episode/$RID/$TID"
            SID=$(python3 -c 'import json,sys;s=json.load(open(sys.argv[1])).get("sources") or [];print(s[0]["id"] if s else "")' "$DIR/sources-type.json")
            if [ -n "$SID" ]; then get episodes-source "$API/episode/$RID/$TID/$SID?sort=0"; fi
          fi

          curl -sS --max-time 30 -X POST -H 'Content-Type: application/json' \
            -d '{"query":"a","searchBy":0}' "$API/search/profiles/0" -o "$DIR/profiles-search.json" || true
          PID=$(python3 -c 'import json,sys;c=json.load(open(sys.argv[1])).get("content") or [];print(c[0]["id"] if c else "")' "$DIR/profiles-search.json")
          if [ -n "$PID" ]; then get profile-one "$API/profile/$PID"; fi

          curl -sS --max-time 30 -X POST -H 'Content-Type: application/json' \
            -d '{"sort":1}' "$API/filter/0" -o "$DIR/filter-page.json" || true

          # Where the built-in player's stream really comes from. Anixart's
          # Libria URL carries AniLibria's own release id, so the episode's HLS
          # is one public request away -- saved here so the Swift decoder is
          # checked against the live shape like everything else.
          curl -sS --max-time 30 "https://anilibria.top/api/v1/anime/releases/9307" \
            -o "$DIR/libria-release.json" || echo "::warning::libria failed"

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      - name: Decode them with AnixartKit
        working-directory: Packages/AnixartKit
        env:
          ANIXART_LIVE_DIR: ${{ steps.fetch.outputs.dir }}
        run: |
          set -o pipefail
          swift test --filter LiveResponseTests 2>&1 | tee "$RUNNER_TEMP/decode.log"

      # The embedded and external players can only play a direct URL, so whether
      # they are reachable at all depends on the mix the catalogue returns. One
      # release says nothing; this walks several.
      - name: Measure how many episodes carry a real stream
        run: python3 Tools/probe-stream-shapes.py --releases 8

      # `iframe: false` says the API gave a URL, not that AVFoundation can open
      # what is behind it. This reports what the hostings actually serve.
      - name: Check what the direct URLs really serve
        run: |
          python3 Tools/probe-stream-playability.py "Киберпанк: Бегущие по краю"

      # Anixart gives no playable URLs at all, so this asks whether a source
      # with a documented public API could supply them without scraping.
      - name: Check AniLibria's own API
        run: |
          python3 Tools/probe-anilibria.py "Киберпанк: Бегущие по краю"

      # The id in Anixart's own Libria URL looks like AniLibria's release id, so
      # the stream may be one public request away. This checks the whole chain.
      - name: Bridge Anixart's Libria URLs to AniLibria's API
        run: |
          python3 Tools/probe-libria-bridge.py "Киберпанк: Бегущие по краю"
          python3 Tools/probe-libria-bridge.py "Ванпанчмен"

      # One source is not enough: AniLibria does not carry every title. This
      # looks for other hostings whose URL carries an id their own API would
      # accept, the way the Libria one does.
      # Everything these probes print is also kept, because the step that
      # repeats the findings at the end of the job is the only part of this log
      # that can be reached without paging through thousands of lines.
      - name: Look for other id bridges
        run: |
          set -o pipefail
          python3 Tools/probe-source-bridges.py --releases 12 \
            2>&1 | tee -a "$RUNNER_TEMP/probe.log"
          # A random sample missed RuTube for twelve releases; «Магическая
          # битва» lists one, and «Клинок» a hosting called "Источник 1". Named
          # titles are how a rare hosting gets measured at all.
          python3 Tools/probe-source-bridges.py --titles \
            "Магическая битва" "Клинок, рассекающий демонов" \
            2>&1 | tee -a "$RUNNER_TEMP/probe.log"

      # Most voice-overs sit on Kodik, whose player guards its stream, so the
      # question is which other services publish their own dubs through an API.
      # Anixart carries no external ids, so Shikimori's search is the bridge --
      # this reports every hop's candidates so the match can be judged.
      - name: Look for services that publish their own dubs
        run: |
          set -o pipefail
          for title in "Киберпанк: Бегущие по краю" "Ванпанчмен" \
                       "Стальной алхимик" "Магическая битва" "Клинок, рассекающий демонов"; do
            python3 Tools/probe-extra-sources.py "$title" \
              2>&1 | tee -a "$RUNNER_TEMP/probe.log"
          done

      # The compile output buries what this job is for, and the logs are only
      # readable from the end. This repeats the findings where they can be read.
      - name: What the live responses said
        if: always()
        run: |
          grep '^live ' "$RUNNER_TEMP/decode.log" || echo "no decode summary"
          echo
          echo "--- what the probes found ---"
          grep -E 'hostings:|libria id|anilibria releases/|rutube id|play/options|m3u8:|players:|none of them carries|stream:|verdict' \
            "$RUNNER_TEMP/probe.log" || echo "no probe findings"

      # Keeps the responses for the next round of model work; they are public
      # API reads with no token attached.
      - name: Upload the responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-responses
          path: ${{ steps.fetch.outputs.dir }}
          if-no-files-found: warn

  app:
    name: iOS app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The runner ships several Xcodes and defaults to a 16.x one, whose SDK has no
      # Liquid Glass. Pick the newest 26.x so the iOS 26 SDK is what we build against;
      # the deployment target stays 17.0, so older systems get the compatibility look.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE" || { echo "::error::no Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project Anixart.xcodeproj \
            -scheme Anixart \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  smoke:
    name: Simulator launch test
    runs-on: macos-15
    needs: app
    steps:
      - uses: actions/checkout@v4

      # The runner ships several Xcodes and defaults to a 16.x one, whose SDK has no
      # Liquid Glass. Pick the newest 26.x so the iOS 26 SDK is what we build against;
      # the deployment target stays 17.0, so older systems get the compatibility look.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE" || { echo "::error::no Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Pick whatever iPhone this runner's Xcode actually ships, rather than
      # hardcoding a model name that moves with each Xcode release.
      - name: Pick and boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            [ .devices | to_entries[]
              | select(.key | test("iOS"))
              | .value[]
              | select(.name | startswith("iPhone"))
              | .udid ] | last // empty')
          test -n "$UDID" || { echo "::error::no available iPhone simulator"; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for that simulator
        run: |
          xcodebuild build \
            -project Anixart.xcodeproj \
            -scheme Anixart \
            -destination "id=$UDID" \
            -configuration Debug \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO

      - name: Install and launch
        run: |
          APP=$(find build-sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'Anixart.app' | head -1)
          test -n "$APP" || { echo "::error::no .app produced"; exit 1; }
          echo "app bundle: $APP"
          xcrun simctl install "$UDID" "$APP"

          # `simctl launch` prints "<bundle id>: <pid>". A simulated app is a real
          # process on the host, so that pid is what we check for survival later.
          OUT=$(xcrun simctl launch "$UDID" app.anixart.client)
          echo "$OUT"
          PID=${OUT##*: }
          echo "PID=$PID" >> "$GITHUB_ENV"

      - name: Fail on launch crash
        run: |
          # Long enough for the first frame, the config request and the restore task.
          sleep 25

          crashed=0
          for dir in "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Logs/CoreSimulator/$UDID"; do
            [ -d "$dir" ] || continue
            found=$(find "$dir" -name '*Anixart*' -newermt '-10 minutes' 2>/dev/null || true)
            if [ -n "$found" ]; then
              echo "::error::crash report found"
              for f in $found; do echo "--- $f"; head -80 "$f"; done
              crashed=1
            fi
          done

          if ps -p "$PID" > /dev/null 2>&1; then
            echo "pid $PID still alive 25s after launch"
          else
            echo "::error::pid $PID is gone -- the app exited or crashed on launch"
            crashed=1
          fi

          [ "$crashed" -eq 0 ]

      # "the process is alive" does not mean "the UI rendered", and the screenshot
      # artifact cannot be read from every environment, so each frame is also
      # emitted into the log as a base64 thumbnail.
      #
      # There is no UI automation here, so the app takes `-anixart-screen` and
      # opens that screen on launch; relaunching with it is how the profile and a
      # release page get photographed at all.
      - name: Screenshot every screen
        if: always()
        run: |
          shoot() {
            name=$1
            xcrun simctl io "$UDID" screenshot "$name.png" || return 0
            sips -Z 320 --setProperty format jpeg "$name.png" --out "$name.jpg" >/dev/null
            echo "--- BEGIN FRAME $name (base64 jpeg) ---"
            base64 -i "$name.jpg" | tr -d '\n' | fold -w 180
            echo
            echo "--- END FRAME $name ---"
          }

          shoot launch

          # `release` opens whatever release/random returns, since this job has no
          # live release id of its own. `player` resolves a real episode and
          # opens the built-in player on it, so the frame carries video rather
          # than a screen that merely rendered.
          for screen in profile release player; do
            xcrun simctl terminate "$UDID" app.anixart.client >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" app.anixart.client -anixart-screen "$screen" || continue
            if [ "$screen" = player ]; then sleep 30; else sleep 18; fi
            shoot "$screen"
          done

      # A decode failure against the real API is the failure this port is most
      # exposed to, so the app's own diagnostics are shown in full and the
      # framework noise is tailed separately -- one `tail` over both once cut a
      # decode error off the top.
      - name: App diagnostics
        if: always()
        run: |
          xcrun simctl spawn "$UDID" log show \
            --predicate 'subsystem == "app.anixart.client"' \
            --last 10m --style compact 2>/dev/null || echo "(no entries)"

      # A screen that renders its error state still leaves the process alive, so
      # the launch check alone would call a decode failure a pass.
      - name: Fail on a decode failure
        if: always()
        run: |
          if xcrun simctl spawn "$UDID" log show \
              --predicate 'subsystem == "app.anixart.client"' \
              --last 10m --style compact 2>/dev/null | grep -q 'decode failed'; then
            echo "::error::the app failed to decode a live API response"
            exit 1
          fi
          echo "no decode failures"

      - name: System log for the app
        if: always()
        run: |
          xcrun simctl spawn "$UDID" log show \
            --predicate 'process == "Anixart" AND subsystem != "app.anixart.client"' \
            --last 10m --style compact 2>/dev/null | tail -60 || echo "(no entries)"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: "*.png"
          if-no-files-found: warn

      # Compiling the player says nothing about whether a stream is found or
      # whether AVFoundation can open it. This reports both, as a warning rather
      # than a failure: whether a third-party service answers a GitHub runner is
      # not this app's correctness.
      - name: What the player found
        if: always()
        run: |
          entries=$(xcrun simctl spawn "$UDID" log show \
            --predicate 'subsystem == "app.anixart.client"' \
            --last 10m --style compact 2>/dev/null || true)

          echo "$entries" | grep 'smoke player:' || echo "::warning::the player smoke screen logged nothing"
          if echo "$entries" | grep -q 'smoke player: stream=yes'; then
            echo "a stream was found"
          else
            echo "::warning::no hosting of the test release handed over a stream"
          fi
          if echo "$entries" | grep -q 'playback ready'; then
            echo "$entries" | grep 'playback ready'
          else
            echo "::warning::AVFoundation never reported the stream ready to play"
          fi

  ipa:
    name: Unsigned IPA
    runs-on: macos-15
    needs: app
    steps:
      - uses: actions/checkout@v4

      # The runner ships several Xcodes and defaults to a 16.x one, whose SDK has no
      # Liquid Glass. Pick the newest 26.x so the iOS 26 SDK is what we build against;
      # the deployment target stays 17.0, so older systems get the compatibility look.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE" || { echo "::error::no Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # No Apple Developer certificate is available here, so this builds for a real
      # device with signing switched off. The result installs only after being
      # re-signed -- see README, "Installing the IPA".
      - name: Build for device, unsigned
        run: |
          # CURRENT_PROJECT_VERSION is the build number iOS compares when replacing
          # an installed copy; without a bump, a new alpha looks identical to the old.
          xcodebuild build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -project Anixart.xcodeproj \
            -scheme Anixart \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Package Payload into an .ipa
        run: |
          APP=$(find build-device/Build/Products/Release-iphoneos -maxdepth 1 -name 'Anixart.app' | head -1)
          test -n "$APP" || { echo "::error::no .app produced"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          # An .ipa is just a zip with the bundle under Payload/.
          zip -qry Anixart-unsigned.ipa Payload
          unzip -l Anixart-unsigned.ipa | head -5
          ls -lh Anixart-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Anixart-unsigned-ipa
          path: Anixart-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish alpha
    runs-on: ubuntu-latest
    needs: [ipa, smoke]
    # Only from the development branch, and never from a pull request. Point this at
    # the default branch when the work moves there.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/claude/ios-port-d6ttd5'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the IPA
        uses: actions/download-artifact@v4
        with:
          name: Anixart-unsigned-ipa

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full_release }}
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION:' project.yml | tr -d '"' | awk '{print $2}')

          if [ "$FULL" = "true" ]; then
            TAG="v${VERSION}"
            TITLE="Anixart ${VERSION}"
            FLAGS="--latest"
          else
            TAG="v${VERSION}-alpha.${{ github.run_number }}"
            TITLE="Anixart ${VERSION} alpha ${{ github.run_number }}"
            # --prerelease keeps the repo's "Latest release" empty until a full one
            # is cut, so an alpha is never mistaken for the real thing.
            FLAGS="--prerelease"
          fi

          mv Anixart-unsigned.ipa "Anixart-${TAG}-unsigned.ipa"

          # Notes live in .github/alpha-release-notes.md rather than a heredoc here:
          # a heredoc inside this block scalar carries its indentation into the file,
          # which Markdown then renders as a code block.
          sed -e "s/__BUILD__/${{ github.run_number }}/g" \
              -e "s/__SHA__/${{ github.sha }}/g" \
              .github/alpha-release-notes.md > notes.md

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            $FLAGS \
            "Anixart-${TAG}-unsigned.ipa"

          echo "published $TAG"
