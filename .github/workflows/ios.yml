name: Build

# The port was written in a Linux container with no Swift toolchain, so this
# workflow is what actually type-checks it. Two jobs on purpose: AnixartKit runs
# its unit tests on macOS without needing a simulator, and the app is built for
# the iOS simulator.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: AnixartKit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build and test AnixartKit
        working-directory: Packages/AnixartKit
        run: swift test --enable-code-coverage

  app:
    name: iOS app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project Anixart.xcodeproj \
            -scheme Anixart \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
