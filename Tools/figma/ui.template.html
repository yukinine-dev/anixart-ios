<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; color: #202024; background: #fff; font: 13px/1.5 Inter, Arial, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.3; }
    p { color: #686870; margin: 0 0 20px; }
    label { display: block; margin: 12px 0; }
    select { width: 100%; padding: 9px; margin-top: 6px; border: 1px solid #d8d8de; border-radius: 8px; background: #fff; color: #202024; }
    input { accent-color: #6b5ce8; }
    button { width: 100%; border: 0; border-radius: 9px; background: #6b5ce8; color: #fff; padding: 12px; font: 600 13px Inter, Arial, sans-serif; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    #status { min-height: 44px; margin-top: 14px; color: #686870; white-space: pre-line; }
    small { color: #86868e; }
  </style>
</head>
<body>
  <h1>Anixart · текущий интерфейс</h1>
  <p>__SCREEN_COUNT__ экранов, 393 × 852. Реконструкция по SwiftUI: редактируемые фреймы, текст, векторные иконки и постеры.</p>
  <label for="theme">Тема
    <select id="theme">
      <option value="both">Светлая и тёмная</option>
      <option value="light">Только светлая</option>
      <option value="dark">Только тёмная</option>
    </select>
  </label>
  <label><input id="kit" type="checkbox" checked> Добавить палитру и базовые компоненты</label>
  <button id="import">Создать макет</button>
  <div id="status" role="status" aria-live="polite"></div>
  <small>Работает без сети и токенов. Существующие страницы не меняет. Данные аккаунта в макете — примеры.</small>
  <script id="design-data" type="application/json">__DESIGN_DATA__</script>
  <script>
    const data = JSON.parse(document.getElementById('design-data').textContent);
    const button = document.getElementById('import');
    const status = document.getElementById('status');
    button.onclick = () => {
      button.disabled = true;
      status.textContent = 'Подготовка шрифтов…';
      parent.postMessage({ pluginMessage: { type: 'import', theme: document.getElementById('theme').value, kit: document.getElementById('kit').checked, data } }, '*');
    };
    window.onmessage = event => {
      const message = event.data.pluginMessage;
      if (!message) return;
      if (message.type === 'progress') status.textContent = message.text;
      if (message.type === 'complete' || message.type === 'error') {
        status.textContent = message.text;
        button.disabled = false;
        if (message.type === 'complete') button.textContent = 'Создать ещё одну копию';
      }
    };
  </script>
</body>
</html>
