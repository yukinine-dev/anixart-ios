# XcodeGen spec. The Xcode project is generated rather than committed so the
# project file cannot drift from the source tree and reviews stay readable:
#
#   brew install xcodegen && xcodegen generate && open Anixart.xcodeproj
#
# Scripts/bootstrap.sh does both steps.
name: Anixart
options:
  bundleIdPrefix: app.anixart
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  AnixartKit:
    path: Packages/AnixartKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Anixart:
    type: application
    platform: iOS
    sources:
      - path: Anixart
    dependencies:
      - package: AnixartKit
        product: AnixartKit
    info:
      path: Anixart/Resources/Info.plist
      properties:
        CFBundleDisplayName: Anixart
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: false
        # Playback continues when the screen locks, as in the Android app.
        UIBackgroundModes:
          - audio
        # Several video hostings still serve their player page or its assets over
        # plain HTTP. This allows it inside the embedded web view only; the API
        # itself stays HTTPS-only.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        ITSAppUsesNonExemptEncryption: false
        # Roboto (Apache-2.0) matches the Android app, which styles almost every
        # text appearance as sans-serif-medium.
        UIAppFonts:
          - Roboto-Regular.ttf
          - Roboto-Medium.ttf
          - Roboto-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.anixart.client
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
